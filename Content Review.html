function CarouselPreview({ slides, activeSlide, onSlide, slideUpdates }) {
  // Merge AI updates into slides for preview
  const displaySlides = slides.map((s, i) => {
    const su = slideUpdates?.[i];
    if (su?.status === 'updated') return { ...s, heading: su.updatedHeading, body: su.updatedBody };
    return s;
  });
  return (
    <div style={{ width: '100%', height: '100%', position: 'relative', background: slides[activeSlide]?.bg || '#000', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', overflow: 'hidden', userSelect: 'none' }}>
      {/* Slide content */}
      <div style={{ padding: '28px 22px', textAlign: 'center', color: displaySlides[activeSlide]?.textColor || '#fff' }}>
        <div style={{ fontSize: 18, fontWeight: 700, lineHeight: '24px', marginBottom: 12, letterSpacing: '-0.01em' }}>{displaySlides[activeSlide]?.heading}</div>
        <div style={{ fontSize: 13, lineHeight: '19px', opacity: 0.85, whiteSpace: 'pre-line' }}>{displaySlides[activeSlide]?.body}</div>
      </div>
      {/* Dot indicator */}
      <div style={{ position: 'absolute', bottom: 14, left: 0, right: 0, display: 'flex', justifyContent: 'center', gap: 5 }}>
        {slides.map((_, i) => (
          <div key={i} onClick={() => onSlide(i)} style={{ width: i === activeSlide ? 16 : 6, height: 6, borderRadius: 3, background: i === activeSlide ? '#fff' : 'rgba(255,255,255,0.4)', cursor: 'pointer', transition: 'width 0.2s' }}></div>
        ))}
      </div>
      {/* Arrows */}
      {activeSlide > 0 && (
        <div onClick={() => onSlide(activeSlide - 1)} style={{ position: 'absolute', left: 8, top: '50%', transform: 'translateY(-50%)', background: 'rgba(0,0,0,0.35)', color: '#fff', borderRadius: '50%', width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 14 }}>‹</div>
      )}
      {activeSlide < slides.length - 1 && (
        <div onClick={() => onSlide(activeSlide + 1)} style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', background: 'rgba(0,0,0,0.35)', color: '#fff', borderRadius: '50%', width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 14 }}>›</div>
      )}
      {/* Slide counter */}
      <div style={{ position: 'absolute', top: 10, right: 10, background: 'rgba(0,0,0,0.5)', color: '#fff', fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 99 }}>{activeSlide + 1}/{slides.length}</div>
    </div>
  );
}

// ─── Edit Panel ─────────────────────────────────────────────────────────────
function EditPanel({ item, edits, onEdit, onApprove, onReject, onManualReview, activeSlide, platform, slideUpdates, onSetInstruction, onUpdateSlide, onRevertSlide }) {
  const platConfig = PLATFORMS.find(p => p.id === platform) || PLATFORMS[0];
  const charMax = platConfig.charLimit;
  const cc = charCount(edits.caption || item.caption);
  const overLimit = cc > charMax;

  const su = slideUpdates[activeSlide] || { instruction: '', status: 'idle' };
  const currentSlide = item.slides?.[activeSlide];
  // For preview: use updated text if available
  const hasUpdate = su.status === 'updated';
  const slideHeading = hasUpdate ? su.updatedHeading : currentSlide?.heading;
  const slideBody    = hasUpdate ? su.updatedBody    : currentSlide?.body;

  // Count slides with pending instructions or updates
  const pendingCount = item.slides ? item.slides.filter((_, i) => slideUpdates[i]?.instruction && slideUpdates[i]?.status === 'idle').length : 0;
  const updatedCount = item.slides ? item.slides.filter((_, i) => slideUpdates[i]?.status === 'updated').length : 0;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minWidth: 0, overflow: 'hidden' }}>
      {/* Scrollable fields */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 0' }}>

        {/* Editor note */}
        {item.editorNote && (
          <div style={{ background: '#FEF3C7', border: '1px solid #FCD34D', borderRadius: 6, padding: '8px 12px', marginBottom: 14, fontSize: 12, lineHeight: '17px', color: '#78350F' }}>
            <strong>⚠ Editor flag:</strong> {item.editorNote}
          </div>
        )}

        {/* AI confidence */}
        {item.aiConfidence && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
            <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>AI confidence</span>
            <div style={{ flex: 1, height: 4, background: 'var(--border)', borderRadius: 2, overflow: 'hidden' }}>
              <div style={{ width: `${item.aiConfidence}%`, height: '100%', background: item.aiConfidence >= 80 ? 'var(--ok)' : item.aiConfidence >= 60 ? 'var(--warn)' : 'var(--err)', borderRadius: 2 }}></div>
            </div>
            <span style={{ fontSize: 11, fontWeight: 600, color: item.aiConfidence >= 80 ? 'var(--ok)' : item.aiConfidence >= 60 ? 'var(--warn)' : 'var(--err)', fontFamily: 'JetBrains Mono, monospace' }}>{item.aiConfidence}%</span>
          </div>
        )}

        {/* Carousel slide update request */}
        {item.type === 'carousel' && item.slides && (
          <div style={{ marginBottom: 16 }}>
            {/* Slide header + status summary */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
              <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-muted)' }}>
                Slide {activeSlide + 1} of {item.slides.length}
              </div>
              <div style={{ display: 'flex', gap: 4 }}>
                {item.slides.map((_, i) => {
                  const s = slideUpdates[i] || {};
                  const dot = s.status === 'updated' ? { bg: 'var(--ok)', label: '✓' }
                            : s.status === 'updating' ? { bg: 'var(--warn)', label: '⟳' }
                            : s.instruction ? { bg: 'var(--warn)', label: '✏' }
                            : { bg: 'var(--border)', label: i + 1 };
                  return (
                    <div key={i} title={`Slide ${i+1}${s.instruction ? ': ' + s.instruction.slice(0,40) : ''}`} style={{ width: 22, height: 22, borderRadius: 4, background: dot.bg, color: dot.bg === 'var(--border)' ? 'var(--text-muted)' : '#fff', fontSize: 10, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'default' }}>{dot.label}</div>
                  );
                })}
              </div>
            </div>

            {/* Current slide content — read only */}
            <div style={{ background: 'var(--row)', borderRadius: 6, padding: '8px 10px', marginBottom: 10, border: '1px solid var(--border)' }}>
              {hasUpdate ? (
                <>
                  <div style={{ fontSize: 11, color: 'var(--ok)', fontWeight: 600, marginBottom: 4 }}>✓ Updated by AI</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--text)', marginBottom: 2 }}>{slideHeading}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', whiteSpace: 'pre-line' }}>{slideBody}</div>
                  <div style={{ marginTop: 6, fontSize: 10, color: 'var(--text-faint)' }}>
                    Original: <em>{su.original?.heading}</em>
                    <button onClick={() => onRevertSlide(activeSlide)} style={{ marginLeft: 8, fontSize: 10, color: 'var(--info)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>↩ Revert</button>
                  </div>
                </>
              ) : (
                <>
                  <div style={{ fontSize: 11, color: 'var(--text-faint)', fontWeight: 600, marginBottom: 4 }}>Rendered slide content (read-only)</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--text)', marginBottom: 2 }}>{currentSlide?.heading}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', whiteSpace: 'pre-line' }}>{currentSlide?.body}</div>
                </>
              )}
            </div>

            {/* Required updates instruction */}
            <div>
              <label style={{ fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Required updates for this slide</label>
              <textarea
                value={su.instruction}
                onChange={e => onSetInstruction(activeSlide, e.target.value)}
                placeholder={`e.g. "Make the heading more positive", "Replace the bullet points with a single clear sentence", "Change tone to be warmer and less clinical"`}
                rows={3}
                disabled={su.status === 'updating'}
                style={{ width: '100%', padding: '7px 10px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 12, lineHeight: '18px', resize: 'vertical', background: su.status === 'updating' ? 'var(--row)' : '#fff', outline: 'none', fontFamily: 'inherit', color: 'var(--text)' }}
              />
              <button
                onClick={() => su.instruction.trim() && onUpdateSlide(activeSlide, currentSlide, su.instruction)}
                disabled={!su.instruction.trim() || su.status === 'updating'}
                style={{ marginTop: 6, width: '100%', padding: '7px', borderRadius: 5, border: 'none', background: su.status === 'updating' ? 'var(--border)' : su.instruction.trim() ? 'var(--pillar-execute)' : 'var(--border)', color: su.instruction.trim() && su.status !== 'updating' ? '#fff' : 'var(--text-faint)', fontSize: 12, fontWeight: 600, cursor: su.instruction.trim() && su.status !== 'updating' ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
                {su.status === 'updating' ? <><span style={{ display: 'inline-block', animation: 'spin 1s linear infinite' }}>⟳</span> Updating slide…</> : '✦ Update this slide with AI'}
              </button>
            </div>

            {/* Summary badge */}
            {(pendingCount > 0 || updatedCount > 0) && (
              <div style={{ marginTop: 10, padding: '6px 10px', background: updatedCount === item.slides.length ? '#F0FDF4' : '#FFF7ED', border: `1px solid ${updatedCount === item.slides.length ? '#86EFAC' : '#FCD34D'}`, borderRadius: 5, fontSize: 11, color: updatedCount === item.slides.length ? 'var(--ok)' : 'var(--warn)', fontWeight: 500 }}>
                {updatedCount > 0 ? `${updatedCount}/${item.slides.length} slides updated` : ''}{pendingCount > 0 ? `${pendingCount} slide${pendingCount > 1 ? 's' : ''} with pending instructions` : ''}
              </div>
            )}
          </div>
        )}

        {/* Reel — script read-only + re-render request */}
        {item.type === 'reel' && (
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-muted)', marginBottom: 8 }}>Current script <span style={{ fontWeight: 400, textTransform: 'none', letterSpacing: 0, color: 'var(--text-faint)' }}>(read-only · baked into rendered video)</span></div>
            <div style={{ background: 'var(--row)', border: '1px solid var(--border)', borderRadius: 5, padding: '8px 10px', fontSize: 11, lineHeight: '17px', color: 'var(--text-muted)', whiteSpace: 'pre-wrap', maxHeight: 120, overflowY: 'auto', fontFamily: 'JetBrains Mono, monospace', marginBottom: 12 }}>
              {item.script}
            </div>
            {(() => {
              const su = slideUpdates[0] || { instruction: '', status: 'idle' };
              const isQueued = su.status === 'queued';
              return (
                <>
                  <label style={{ fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Required updates for re-render</label>
                  <textarea
                    value={su.instruction}
                    onChange={e => onSetInstruction(0, e.target.value)}
                    placeholder={`e.g. "Make the hook stronger — lead with the problem not the solution", "Replace the CTA with 'save this for meal prep Sunday'", "Slow down the pacing in the cooking section"`}
                    rows={4}
                    disabled={isQueued}
                    style={{ width: '100%', padding: '7px 10px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 12, lineHeight: '18px', resize: 'vertical', background: isQueued ? 'var(--row)' : '#fff', outline: 'none', fontFamily: 'inherit', color: 'var(--text)' }}
                  />
                  {isQueued ? (
                    <div style={{ marginTop: 8, padding: '8px 12px', background: '#F0FDF4', border: '1px solid #86EFAC', borderRadius: 5, fontSize: 11, color: 'var(--ok)', fontWeight: 600 }}>
                      ✓ Re-render queued · {su.queuedAt} · S2c will pick up with original video reference
                    </div>
                  ) : (
                    <button
                      onClick={() => {
                        if (!su.instruction.trim()) return;
                        onSetInstruction(0, su.instruction);
                        // Mark as queued with timestamp
                        onUpdateSlide(0, { heading: 'reel', body: item.script }, su.instruction, true);
                      }}
                      disabled={!su.instruction.trim()}
                      style={{ marginTop: 6, width: '100%', padding: '7px', borderRadius: 5, border: 'none', background: su.instruction.trim() ? '#B45309' : 'var(--border)', color: su.instruction.trim() ? '#fff' : 'var(--text-faint)', fontSize: 12, fontWeight: 600, cursor: su.instruction.trim() ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
                      ↺ Queue for re-render via S2c
                    </button>
                  )}
                </>
              );
            })()}
          </div>
        )}

        {/* Static image — update request */}
        {item.type === 'static' && (
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-muted)', marginBottom: 8 }}>Image</div>
            <div style={{ background: 'var(--row)', border: '1px solid var(--border)', borderRadius: 5, padding: '8px 10px', fontSize: 11, lineHeight: '17px', color: 'var(--text-muted)', marginBottom: 12, fontStyle: 'italic' }}>
              {item.imageDesc || 'Rendered image (no description available)'}
            </div>
            {(() => {
              const su = slideUpdates[0] || { instruction: '', status: 'idle' };
              const isUpdating = su.status === 'updating';
              const isUpdated  = su.status === 'updated';
              return (
                <>
                  {isUpdated ? (
                    <div style={{ padding: '8px 10px', background: '#F0FDF4', border: '1px solid #86EFAC', borderRadius: 5, marginBottom: 8 }}>
                      <div style={{ fontSize: 11, color: 'var(--ok)', fontWeight: 600, marginBottom: 2 }}>✓ Image updated by AI</div>
                      <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Instruction applied: <em>{su.instruction}</em></div>
                      <button onClick={() => onRevertSlide(0)} style={{ marginTop: 4, fontSize: 10, color: 'var(--info)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>↩ Revert to original</button>
                    </div>
                  ) : null}
                  <label style={{ fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Required updates</label>
                  <textarea
                    value={su.instruction}
                    onChange={e => onSetInstruction(0, e.target.value)}
                    placeholder={`e.g. "Change the background to a warmer tone", "Make the headline larger and more prominent", "Add a subtle grid/table layout for the sleep schedule"`}
                    rows={3}
                    disabled={isUpdating}
                    style={{ width: '100%', padding: '7px 10px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 12, lineHeight: '18px', resize: 'vertical', background: isUpdating ? 'var(--row)' : '#fff', outline: 'none', fontFamily: 'inherit', color: 'var(--text)' }}
                  />
                  <button
                    onClick={() => su.instruction.trim() && onUpdateSlide(0, { heading: item.idea, body: item.imageDesc }, su.instruction)}
                    disabled={!su.instruction.trim() || isUpdating}
                    style={{ marginTop: 6, width: '100%', padding: '7px', borderRadius: 5, border: 'none', background: isUpdating ? 'var(--border)' : su.instruction.trim() ? 'var(--pillar-execute)' : 'var(--border)', color: isUpdating || !su.instruction.trim() ? 'var(--text-faint)' : '#fff', fontSize: 12, fontWeight: 600, cursor: su.instruction.trim() && !isUpdating ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
                    {isUpdating ? <><span style={{ display: 'inline-block', animation: 'spin 1s linear infinite' }}>⟳</span> Updating image…</> : '✦ Update image with AI'}
                  </button>
                </>
              );
            })()}
          </div>
        )}

        {/* Caption */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-muted)' }}>Caption</div>
            <span style={{ fontSize: 11, fontFamily: 'JetBrains Mono, monospace', color: overLimit ? 'var(--err)' : cc > charMax * 0.82 ? 'var(--warn)' : 'var(--text-faint)' }}>{cc} / {charMax} · {platConfig.label}</span>
          </div>
          <textarea
            value={edits.caption ?? item.caption}
            onChange={e => onEdit({ caption: e.target.value })}
            rows={7}
            style={{ width: '100%', padding: '8px 10px', border: `1px solid ${overLimit ? 'var(--err)' : 'var(--border)'}`, borderRadius: 5, fontSize: 12, lineHeight: '18px', resize: 'vertical', background: '#fff', outline: 'none', fontFamily: 'inherit' }}
          />
          {edits.caption !== undefined && edits.caption !== item.caption && (
            <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 4 }}>
              <button onClick={() => onEdit({ caption: item.caption })} style={{ fontSize: 11, color: 'var(--info)', background: 'none', border: 'none', cursor: 'pointer', padding: '2px 0' }}>↩ Revert to AI original</button>
            </div>
          )}
        </div>

        {/* Offer + schedule */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 }}>
          <div>
            <label style={{ fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 3 }}>Offer / Bio link</label>
            <input value={item.offer || '—'} readOnly style={{ width: '100%', padding: '5px 8px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 12, background: 'var(--row)', color: 'var(--text-muted)', outline: 'none' }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 3 }}>Scheduled publish</label>
            <input value={item.scheduleTime} readOnly style={{ width: '100%', padding: '5px 8px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 12, background: 'var(--row)', color: 'var(--text-muted)', outline: 'none', fontFamily: 'JetBrains Mono, monospace' }} />
          </div>
        </div>

        {/* Audit trail stub */}
        <div style={{ marginBottom: 16, padding: '8px 10px', background: 'var(--row)', borderRadius: 5, fontSize: 11, color: 'var(--text-muted)', lineHeight: '16px' }}>
          <strong>Audit trail</strong> · Created by S{item.scenario?.slice(1) || '2c'} · AI draft {item.created} · {Object.keys(edits).length > 0 ? <span style={{ color: 'var(--warn)', fontWeight: 600 }}>Edited — not yet saved</span> : <span style={{ color: 'var(--ok)' }}>No edits</span>}
        </div>
      </div>

      {/* Approval toolbar — pinned to bottom */}
      <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', background: '#fff', display: 'flex', gap: 8, flexShrink: 0 }}>
        <button onClick={onReject} style={{ padding: '7px 14px', borderRadius: 5, border: '1px solid var(--border)', background: '#fff', color: 'var(--err)', fontSize: 13, fontWeight: 600, cursor: 'pointer', flex: 1 }}>
          ✕ Reject
        </button>
        <button onClick={onManualReview} style={{ padding: '7px 14px', borderRadius: 5, border: '1px solid var(--border)', background: '#fff', color: 'var(--warn)', fontSize: 13, fontWeight: 600, cursor: 'pointer', flex: 1 }}>
          ⚑ Flag
        </button>
        <button onClick={onApprove} style={{ padding: '7px 14px', borderRadius: 5, border: 'none', background: Object.keys(edits).length > 0 ? 'var(--info)' : 'var(--ok)', color: '#fff', fontSize: 13, fontWeight: 600, cursor: 'pointer', flex: 2 }}>
          {Object.keys(edits).length > 0 ? '💾 Save & approve' : '✓ Approve'}
        </button>
      </div>
    </div>
  );
}

// ─── App ────────────────────────────────────────────────────────────────────
function App() {
  const [queue, setQueue] = useState(QUEUE);
  const [activeId, setActiveId] = useState(QUEUE[0].id);
  const [editsMap, setEditsMap] = useState({});
  const [slideMap, setSlideMap] = useState({});
  const [toast, setToast] = useState(null);
  const [filter, setFilter] = useState('all');
  const [platform, setPlatform] = useState('instagram');
  // slideUpdateMap: { [assetId]: { [slideIdx]: { instruction, status: 'idle'|'updating'|'updated', updatedHeading, updatedBody, original } } }
  const [slideUpdateMap, setSlideUpdateMap] = useState({});

  const item = queue.find(i => i.id === activeId);
  const edits = editsMap[activeId] || {};
  const activeSlide = slideMap[activeId] || 0;

  const showToast = (msg, type = 'ok') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2800);
  };

  const onEdit = (patch) => setEditsMap(m => ({ ...m, [activeId]: { ...edits, ...patch } }));
  const onSlide = (i) => setSlideMap(m => ({ ...m, [activeId]: i }));

  // Slide update helpers
  const getSlideUpdate = (assetId, slideIdx) => slideUpdateMap[assetId]?.[slideIdx] || { instruction: '', status: 'idle' };
  const setSlideInstruction = (assetId, slideIdx, instruction) => {
    setSlideUpdateMap(m => ({ ...m, [assetId]: { ...(m[assetId] || {}), [slideIdx]: { ...getSlideUpdate(assetId, slideIdx), instruction } } }));
  };
  const updateSlide = async (assetId, slideIdx, slide, instruction, queueOnly = false) => {
    // Reel re-render: just queue, don't call AI
    if (queueOnly) {
      const ts = new Date().toISOString().slice(0,16).replace('T',' ') + ' UTC';
      setSlideUpdateMap(m => ({ ...m, [assetId]: { ...(m[assetId] || {}), [slideIdx]: { instruction, status: 'queued', queuedAt: ts } } }));
      showToast(`Re-render queued for ${assetId} · S2c notified`, 'ok');
      return;
    }
    setSlideUpdateMap(m => ({ ...m, [assetId]: { ...(m[assetId] || {}), [slideIdx]: { ...getSlideUpdate(assetId, slideIdx), status: 'updating' } } }));
    try {
      const prompt = `You are updating a single Instagram carousel slide. The slide currently has:\nHeading: "${slide.heading}"\nBody: "${slide.body}"\n\nRequired update from the operator: "${instruction}"\n\nReturn ONLY a JSON object with keys "heading" and "body" containing the updated text. Keep the same tone and style unless instructed otherwise. Keep it concise — headings max 8 words, body max 25 words.`;
      const result = await window.claude.complete({ messages: [{ role: 'user', content: prompt }] });
      let parsed;
      try { parsed = JSON.parse(result.match(/\{[\s\S]*\}/)?.[0] || '{}'); } catch { parsed = {}; }
      const updatedHeading = parsed.heading || slide.heading;
      const updatedBody = parsed.body || slide.body;
      setSlideUpdateMap(m => ({ ...m, [assetId]: { ...(m[assetId] || {}), [slideIdx]: { instruction, status: 'updated', updatedHeading, updatedBody, original: { heading: slide.heading, body: slide.body } } } }));
      showToast(`Slide ${slideIdx + 1} updated ✓`, 'ok');
    } catch(e) {
      setSlideUpdateMap(m => ({ ...m, [assetId]: { ...(m[assetId] || {}), [slideIdx]: { ...getSlideUpdate(assetId, slideIdx), status: 'idle' } } }));
      showToast('Update failed — try again', 'err');
    }
  };
  const revertSlide = (assetId, slideIdx) => {
    setSlideUpdateMap(m => ({ ...m, [assetId]: { ...(m[assetId] || {}), [slideIdx]: { instruction: '', status: 'idle' } } }));
  };

  const onApprove = () => {
    setQueue(q => q.filter(i => i.id !== activeId));
    setEditsMap(m => { const n = {...m}; delete n[activeId]; return n; });
    const remaining = queue.filter(i => i.id !== activeId);
    if (remaining.length) setActiveId(remaining[0].id);
    showToast(`${activeId} approved${Object.keys(edits).length > 0 ? ' with edits' : ''} ✓`, 'ok');
  };
  const onReject = () => {
    setQueue(q => q.filter(i => i.id !== activeId));
    const remaining = queue.filter(i => i.id !== activeId);
    if (remaining.length) setActiveId(remaining[0].id);
    showToast(`${activeId} rejected and removed from queue`, 'err');
  };
  const onManualReview = () => {
    setQueue(q => q.map(i => i.id === activeId ? { ...i, status: 'manual_review' } : i));
    showToast(`${activeId} flagged for manual review`, 'warn');
  };

  const filtered = queue.filter(i => filter === 'all' || i.status === filter || i.type === filter || i.subniche === filter);

  // Merge edits into item for live preview
  const previewItem = item ? {
    ...item,
    caption: edits.caption ?? item.caption,
    slides: (edits.slides && item.slides) ? item.slides.map((s, i) => ({ ...s, ...(edits.slides[i] || {}) })) : item.slides,
    script: edits.script ?? item.script,
  } : null;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', background: 'var(--bg)' }}>
      {/* Page header */}
      <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 20px 12px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
        <div>
          <h1 style={{ margin: 0, fontSize: 20, fontWeight: 600, letterSpacing: '-0.015em', lineHeight: '26px' }}>Content Review <span style={{ color: 'var(--text-muted)', fontWeight: 400 }}>— preview, edit &amp; approve</span></h1>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          {/* Filter chips */}
          {['all', 'manual_review', 'pending_approval', 'carousel', 'reel', 'static'].map(f => (
            <button key={f} onClick={() => setFilter(f)} style={{ padding: '4px 10px', borderRadius: 99, border: '1px solid var(--border)', background: filter === f ? 'var(--text)' : '#fff', color: filter === f ? '#fff' : 'var(--text-muted)', fontSize: 11, fontWeight: 600, cursor: 'pointer', textTransform: 'capitalize', letterSpacing: '0.02em' }}>
              {f === 'all' ? `All (${queue.length})` : f === 'manual_review' ? `⚠ Manual review (${queue.filter(i=>i.status==='manual_review').length})` : f === 'pending_approval' ? `Pending (${queue.filter(i=>i.status==='pending_approval').length})` : f.charAt(0).toUpperCase() + f.slice(1)}
            </button>
          ))}
        </div>
      </header>

      {/* 3-panel body */}
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '264px 1fr 340px', minHeight: 0, overflow: 'hidden' }}>

        {/* ── Queue list ── */}
        <div style={{ borderRight: '1px solid var(--border)', overflowY: 'auto', background: 'var(--panel)' }}>
          <div style={{ padding: '8px 14px 6px', borderBottom: '1px solid var(--border)', fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-muted)' }}>
            Review queue · {filtered.length} item{filtered.length !== 1 ? 's' : ''}
          </div>
          {filtered.length === 0 && (
            <div style={{ padding: 24, textAlign: 'center', color: 'var(--text-faint)', fontSize: 12 }}>Queue empty</div>
          )}
          {filtered.map(i => (
            <QueueItem key={i.id} item={i} active={i.id === activeId} onClick={() => setActiveId(i.id)} />
          ))}
        </div>

        {/* ── Phone preview ── */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', background: '#F1F5F9', overflowY: 'auto' }}>
          {/* Platform switcher */}
          <div style={{ width: '100%', padding: '12px 16px 0', display: 'flex', gap: 6, justifyContent: 'center', flexWrap: 'wrap' }}>
            {PLATFORMS.map(p => (
              <button key={p.id} onClick={() => setPlatform(p.id)} style={{ padding: '4px 12px', borderRadius: 99, border: '1px solid', borderColor: platform === p.id ? p.color : 'var(--border)', background: platform === p.id ? p.color : '#fff', color: platform === p.id ? '#fff' : 'var(--text-muted)', fontSize: 11, fontWeight: 600, cursor: 'pointer', transition: 'all 0.15s' }}>
                {p.label}
              </button>
            ))}
          </div>

          {/* Preview area */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', flex: 1, padding: '16px 20px', gap: 12, minHeight: 0 }}>
            {previewItem ? (
              <>
                <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
                  {PLATFORMS.find(p => p.id === platform)?.label} preview · {TYPE_LABEL[previewItem.type]}
                </div>
                {platform === 'instagram' && <IGPhoneFrame item={previewItem} activeSlide={activeSlide} onSlide={onSlide} slideUpdates={slideUpdateMap[activeId] || {}} />}
                {platform === 'threads'   && <ThreadsPhoneFrame item={previewItem} />}
                {platform === 'tiktok'    && <TikTokPhoneFrame item={previewItem} />}
                {platform === 'x'         && <XPhoneFrame item={previewItem} />}
                {platform === 'youtube'   && <YouTubePhoneFrame item={previewItem} />}

                {previewItem.type === 'carousel' && platform === 'instagram' && (
                  <div style={{ display: 'flex', gap: 6 }}>
                    {previewItem.slides.map((_, i) => (
                      <button key={i} onClick={() => onSlide(i)} style={{ width: 28, height: 20, borderRadius: 4, border: '1px solid var(--border)', background: i === activeSlide ? 'var(--text)' : '#fff', color: i === activeSlide ? '#fff' : 'var(--text-muted)', fontSize: 10, fontWeight: 600, cursor: 'pointer' }}>{i + 1}</button>
                    ))}
                  </div>
                )}

                {/* Platform char limit warning */}
                {(() => {
                  const plat = PLATFORMS.find(p => p.id === platform);
                  const cc = (previewItem.caption || '').length;
                  const over = cc > plat.charLimit;
                  if (over) return (
                    <div style={{ background: '#FEE2E2', border: '1px solid #FCA5A5', borderRadius: 6, padding: '6px 12px', fontSize: 11, color: 'var(--err)', fontWeight: 600 }}>
                      ⚠ Caption is {cc - plat.charLimit} chars over {plat.label}'s {plat.charLimit} limit
                    </div>
                  );
                  return null;
                })()}

                <div style={{ fontSize: 11, color: 'var(--text-faint)', textAlign: 'center' }}>
                  Edits reflect live · {previewItem.scheduleTime}
                </div>
              </>
            ) : (
              <div style={{ color: 'var(--text-faint)', fontSize: 13 }}>Select an item to preview</div>
            )}
          </div>
        </div>

        {/* ── Edit + approve panel ── */}
        <div style={{ borderLeft: '1px solid var(--border)', display: 'flex', flexDirection: 'column', minHeight: 0, overflow: 'hidden' }}>
          {/* Panel header */}
          <div style={{ padding: '10px 16px 8px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 12, fontWeight: 600, color: 'var(--text)' }}>{item?.id}</span>
              {item && <span style={{ fontSize: 10, fontWeight: 600, padding: '1px 6px', borderRadius: 3, background: TYPE_COLOR[item.type], color: '#1E293B' }}>{TYPE_LABEL[item.type]}</span>}
              {item && <span style={{ fontSize: 10, fontWeight: 600, padding: '1px 6px', borderRadius: 3, background: STATUS_COLOR[item.status], color: STATUS_TEXT[item.status] }}>{STATUS_LABEL[item.status]}</span>}
            </div>
            {item && <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2, lineHeight: '15px' }}>{item.idea}</div>}
          </div>
          {previewItem ? (
            <EditPanel item={previewItem} edits={edits} onEdit={onEdit} onApprove={onApprove} onReject={onReject} onManualReview={onManualReview} activeSlide={activeSlide} platform={platform} slideUpdates={slideUpdateMap[activeId] || {}} onSetInstruction={(idx, val) => setSlideInstruction(activeId, idx, val)} onUpdateSlide={(idx, slide, instr) => updateSlide(activeId, idx, slide, instr)} onRevertSlide={(idx) => revertSlide(activeId, idx)} />
          ) : (
            <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-faint)', fontSize: 12 }}>No item selected</div>
          )}
        </div>
      </div>

      {/* Toast */}
      {toast && (
        <div style={{ position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', background: toast.type === 'ok' ? 'var(--ok)' : toast.type === 'err' ? 'var(--err)' : '#B07A00', color: '#fff', padding: '10px 20px', borderRadius: 8, fontSize: 13, fontWeight: 600, boxShadow: '0 4px 20px rgba(0,0,0,0.2)', zIndex: 9999 }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
